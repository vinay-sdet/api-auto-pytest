[pytest]
testpaths = tests
addopts = --html=report.html --self-contained-html
markers =
    smoke: critical API checks
    regression: broader API regression checks
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S